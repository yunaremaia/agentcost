[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcost-py"
version = "0.3.0"
description = "Token usage tracker for multi-agent AI sessions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
keywords = ["ai", "agents", "tokens", "cost", "claude", "codex", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    # budget.py reads the TOML budget config through a tomllib/tomli
    # try/except, so the 3.10 fallback has to be a real dependency:
    # without it a `pip install` of the wheel cannot even import the CLI.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agentcost = "agentcost.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/yunaremaia/agentcost"
Issues = "https://github.com/yunaremaia/agentcost/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentcost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
