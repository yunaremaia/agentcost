[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcost-py"
version = "0.4.0"
description = "Token usage tracker for multi-agent AI sessions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
keywords = ["ai", "agents", "tokens", "cost", "claude", "codex", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    # budget.py reads the TOML budget config through a tomllib/tomli
    # try/except, so the 3.10 fallback has to be a real dependency:
    # without it a `pip install` of the wheel cannot even import the CLI.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agentcost = "agentcost.cli:cli"

[project.optional-dependencies]
# ruff backs the lint CI job, so it lives here rather than being installed ad
# hoc in the workflow: local and CI then run the same version.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/yunaremaia/agentcost"
Issues = "https://github.com/yunaremaia/agentcost/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentcost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.report]
# Floor at the measured CI baseline: 1031/1326 statements = 77.75%, rounded
# down. Measure this with an empty HOME -- cli.py and hermes_sqlite.py read a
# live ~/.hermes/state.db, so on a dev box with Hermes installed the same suite
# reports ~80% and the gate would not reflect what CI actually enforces.
# hermes_sqlite.py is the biggest hole (38%) and is the first place to spend
# new tests; raise this number as real coverage grows, never below the baseline.
fail_under = 77
